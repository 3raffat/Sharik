<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Your Email</title>
</head>
<body style="margin:0; padding:0; background-color:#f5f5f5; font-family:Arial, sans-serif;">

    <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
        <tr>
            <td align="center">

                <table width="520" cellpadding="0" cellspacing="0"
                       style="background:#ffffff; border-radius:10px; padding:40px;">

                    <!-- Title -->
                    <tr>
                        <td align="center" style="padding-bottom:25px;">
                            <h2 style="margin:0; color:#111111;">Confirm Your Email</h2>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="color:#333333; font-size:15px; line-height:1.6;">

                            <p style="margin:0 0 20px 0;">
                                Hi <strong>{{UserName}}</strong>,
                            </p>

                            <p style="margin:0 0 25px 0;">
                                Please confirm your email address to activate your account.
                            </p>

                            <!-- Black Button -->
                            <div style="text-align:center; margin:30px 0;">
                                <a href="{{ConfirmationLink}}"
                                   style="background-color:#000000;
                          color:#ffffff;
                          padding:14px 30px;
                          text-decoration:none;
                          border-radius:6px;
                          font-weight:bold;
                          display:inline-block;">
                                    Confirm Email
                                </a>
                            </div>

                            <p style="font-size:13px; color:#777777;">
                                If you did not create this account, you can ignore this email.
                            </p>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td align="center" style="padding-top:35px; font-size:12px; color:#999999;">
                            © 2026 Sharik
                        </td>
                    </tr>

                </table>

            </td>
        </tr>
    </table>

</body>
</html>
